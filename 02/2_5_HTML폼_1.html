<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="">
    <!-- 텍스트상자와 레이블 -->
    <label for="username">이름</label>
    <input type="text" id="username" name="username"/>
    <hr/>
    <!-- 텍스트상의 종류 text, password, email, number -->
    <input type="text" placeholder="🥸이름"/>
    <input type="password" placeholder="🔐비밀번호"/>
    <input type="email" placeholder="sss@sss.com"/>
    <input type="number" min="0" max="100" placeholder="숫자"/>
    <hr/>

    <!-- 체크상자와 레디오상자 -->
    <input type="checkbox" id="agree" checked="checked" />
    <label for="agree">동의합니다.</label>
    <br/>
    <input type="radio" name="gender" id="male" checked="checked"><label for="male">남자</label>
    <input type="radio" name="gender" id="female" checked="checked"><label for="female">여자</label>
    <hr/>

    <!-- 선택상자 -->
    <select style="width:100px;">
      <option value="02">서울</option>
      <option value="03">부산</option>
      <option value="04">대구</option>
      <option value="05">광주</option>
    </select>
    <br><br>
    <select style="width:100px;" size="3">
      <option value="02">서울</option>
      <option value="03">부산</option>
      <option value="04">대구</option>
      <option value="05">광주</option>
    </select>
    <hr/>
    <!-- 텍스트에어리어와 버튼 -->
    <textarea rows="3" cols="23">
12345678901234567890123이것은 텍스트에어리어입니다 Lorem ipsum dolor, sit amet consectetur adipisicing elit. Eos voluptas nesciunt repellendus fugit quibusdam velit iure beatae mollitia ducimus fuga. Quos, officiis doloribus enim nostrum accusamus in accusantium non blanditiis.
    </textarea>
    <input type="button" value="클릭">
    <hr/>

    <fieldset style="width:100px">
      <legend>개인정보</legend>
      <label for="name">이름</label>
      <input type="text" id="name">
      <label for="age">나이</label>
      <input type="number" id="age">
    </fieldset>



     
    


  </form>
  
</body>
</html>
