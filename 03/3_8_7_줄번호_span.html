<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      display:grid;
      grid-template-columns: repeat(4,110px);
      grid-template-rows : repeat(3,70px);
      background-color: #f1f3f9;
      background-size: 100px 70px;
      border: 2px solid #334155;
    }

    .item{
      padding: 6px;
      border: 2px solid #334155; 
      color: white;     
    }
    .a { background-color: blue; grid-column: 1/3;}
    .b { background-color: red;  grid-column: 3/ span 2 }
    .c { background-color: brown; grid-column: 1; grid-row: 2/4}
    .d{ background-color: chartreuse; grid-column: 2/-2;}
    .e { background-color: green; grid-column: 3; grid-row: 3;}



  </style>
</head>
<body>
  
  <div class="container">
    <div class="item a">A: 1 / 3</div>
    <div class="item b">B: 3 / span 2</div>
    <div class="item c">C: 행 2 / 4</div>
    <div class="item d">D: 2 / -1</div>
    <div class="item e">E: 3, 행 3</div>
  </div>
</body>
</html>
