<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      display: flex;
      background-color: #f1f5f9;
      border: 2px solid #334155;
      flex-direction: row;

    }
    .item{
      width: 140px;
      background-color: #0d9488;
      color:white;
      outline: 1px solid white;
      padding:10px;
    }
    .inner{
      color:#1e293b;
      background-color: #fde68a;
      margin: 5px;

    }
    .child2{
      display:flex;
      flex-direction: column-reverse;

    }

  </style>
</head>
<body>
  <div class="container">
    <div class="item">
      자식1
      <div class="inner">손자A</div>
      <div class="inner">손자B</div>
    </div>
    <div class="item child2">
      자식2
      <div class="inner">손자A</div>
      <div class="inner">손자B</div>
    </div>
    <div class="item">
      자식3
    </div>
  </div>
  
</body>
</html>
