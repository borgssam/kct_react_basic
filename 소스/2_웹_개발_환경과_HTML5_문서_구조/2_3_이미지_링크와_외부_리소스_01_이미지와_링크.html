<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이미지와 링크</title>
</head>
<body>
  <h1>이미지와 링크</h1>

  <!-- 이미지 삽입과 alt 속성 -->
  <img src="고양이.jpg" alt="창가에 앉아있는 고양이">

  <!-- 웹 사이트 내부 및 외부 링크 -->
  <p>
    <a href="about.html">내부 페이지로 이동</a>
    <a href="https://developer.mozilla.org">외부 사이트로 이동</a>
  </p>

  <!-- 새 창 열기와 링크 보안 속성 -->
  <p>
    <a href="https://example.com" target="_blank" rel="noopener noreferrer">새 탭에서 열기</a>
  </p>

  <!-- 파일 다운로드 링크 -->
  <p>
    <a href="자료.pdf" download>자료 다운로드</a>
  </p>
</body>
</html>
