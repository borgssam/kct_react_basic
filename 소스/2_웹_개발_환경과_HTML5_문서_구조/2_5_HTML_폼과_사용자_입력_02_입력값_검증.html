<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>HTML 기본 입력값 검증</title>
</head>
<body>
  <!-- placeholder, required, minlength, maxlength -->
  <!-- 비워둔 채 제출하면 브라우저가 기본 경고 풍선을 띄운다 -->
  <form>
    <input type="text" placeholder="닉네임을 입력하세요" required minlength="2" maxlength="10">
    <button type="submit">제출</button>
  </form>
</body>
</html>
