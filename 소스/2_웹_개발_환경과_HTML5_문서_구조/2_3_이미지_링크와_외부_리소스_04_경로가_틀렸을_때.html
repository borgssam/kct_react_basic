<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>경로가 틀렸을 때</title>
</head>
<body>
  <h1>경로가 틀렸을 때</h1>

  <!-- 맞는 경로: 같은 폴더의 고양이.jpg -->
  <img src="고양이.jpg" alt="창가에 앉아있는 고양이" width="240">

  <img src="images/고양이.jpg" alt="창가에 앉아있는 고양이" width="240">
</body>
</html>
