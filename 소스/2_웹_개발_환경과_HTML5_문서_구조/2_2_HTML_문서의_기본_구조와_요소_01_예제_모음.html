<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>HTML 문서의 기본 구조와 요소</title>
</head>
<body>
  <!-- 화면에 보이는 내용은 전부 여기 들어간다 -->

  <!-- 제목과 문단 작성 -->
  <h1>가장 큰 제목</h1>
  <h2>그 다음 크기 제목</h2>
  <p>문단 내용은 p 태그로 감싼다.</p>

  <!-- 줄 바꿈과 구분선 -->
  <p>같은 문단 안에서<br>줄만 바꾼다.</p>
  <hr>

  <!-- 강조 및 인용 요소 -->
  <strong>중요해서 굵게</strong>, <em>의미상 강조해서 기울임</em>.
  <blockquote>긴 인용문은 이렇게.</blockquote>
  <q>짧은 인용은 이렇게.</q>

  <!-- div와 span의 역할 -->
  <div>div는 줄 전체를 차지하는 블록 단위 묶음이고, <span>span은 글자 중간 일부만</span> 감싼다.</div>

  <!-- 순서 있는 목록과 순서 없는 목록 -->
  <ul>
    <li>순서 없는 목록 항목</li>
    <li>마트 장보기 목록처럼</li>
  </ul>

  <ol>
    <li>순서 있는 목록 항목</li>
    <li>조리 순서처럼</li>
  </ol>

  <!-- HTML 주석과 특수문자 -->
  <p>&lt;p&gt; 태그와 &amp; 기호를 화면에 그대로 보여준다.</p>
</body>
</html>
