<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>dialog를 활용한 대화상자</title>
</head>
<body>
  <!-- dialog를 활용한 대화상자 -->
  <dialog id="myDialog">
    <p>정말 삭제하시겠습니까?</p>
    <button type="button" onclick="document.getElementById('myDialog').close()">닫기</button>
  </dialog>
  <button type="button" onclick="document.getElementById('myDialog').showModal()">삭제</button>
</body>
</html>
