<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- meta 요소와 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="description" content="이 페이지에 대한 한두 줄 설명">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시맨틱 HTML과 문서 구성</title>
</head>
<body>
  <!-- header, nav, main, section, article, aside, footer -->
  <header>로고, 사이트 제목</header>
  <nav>메뉴 링크들</nav>
  <main>
    <section>
      <article>글 하나 전체</article>
    </section>
    <aside>관련 글, 광고 등 부수적인 내용</aside>
  </main>
  <footer>저작권 표시, 연락처</footer>
</body>
</html>
