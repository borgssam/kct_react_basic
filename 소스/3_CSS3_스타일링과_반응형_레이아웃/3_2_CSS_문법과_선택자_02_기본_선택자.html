<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요소, 클래스, ID 선택자</title>
  <link rel="stylesheet" href="3_2_CSS_문법과_선택자_02_기본_선택자.css">

<body>
  <h1 id="title">ID 선택자로 키운 제목</h1>
  <p>요소 선택자: 모든 p는 파란색</p>
  <p class="highlight">복합 선택자: p이면서 highlight 클래스</p>
  <span class="highlight">클래스 선택자: highlight 클래스</span>
  <h2>그룹 선택자 h2</h2>
  <h3>그룹 선택자 h3</h3>
