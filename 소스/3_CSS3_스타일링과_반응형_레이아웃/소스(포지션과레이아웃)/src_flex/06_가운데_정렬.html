<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>06 가운데 정렬</title>
  <style>
    .container {
      display: flex;
      justify-content: center; /* 주축(가로) 가운데 */
      align-items: center;     /* 교차축(세로) 가운데 */
      width: 400px;
      height: 200px;
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      padding: 16px 28px;
      font-weight: bold;
      color: white;
      background: #0d9488;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item">정가운데</div>
  </div>
</body>
</html>
