<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>03 flex-direction</title>
  <style>
    .demos { display: flex; flex-wrap: wrap; gap: 0 32px; }
    p { margin: 12px 0 6px; font-family: monospace; }

    .container {
      display: flex;
      width: 260px;
      height: 190px;
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      width: 60px;
      height: 60px;
      line-height: 60px;
      text-align: center;
      font-weight: bold;
      color: white;
      background: #0d9488;
      outline: 1px solid white;
    }

    .row            { flex-direction: row; }
    .row-reverse    { flex-direction: row-reverse; }
    .column         { flex-direction: column; }
    .column-reverse { flex-direction: column-reverse; }
  </style>
</head>
<body>
  <div class="demos">
    <div>
      <p>row (기본값)</p>
      <div class="container row">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>row-reverse</p>
      <div class="container row-reverse">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>column</p>
      <div class="container column">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>column-reverse</p>
      <div class="container column-reverse">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
  </div>
</body>
</html>
