<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>12 flex-grow</title>
  <style>
    p { margin: 12px 0 6px; font-family: monospace; }

    .container {
      display: flex;
      width: 400px; /* 자식 합계 100px × 3 = 300px → 100px이 남는다 */
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      width: 100px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
      background: #0d9488;
      outline: 1px solid white;
    }

    .grow1 { flex-grow: 1; }
    .grow2 { flex-grow: 2; }
  </style>
</head>
<body>
  <p>flex-grow 없음 (기본값 0)</p>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <p>가운데 자식만 flex-grow: 1</p>
  <div class="container">
    <div class="item">1</div>
    <div class="item grow1">2</div>
    <div class="item">3</div>
  </div>

  <p>flex-grow: 1 / 2 / 1</p>
  <div class="container">
    <div class="item grow1">1</div>
    <div class="item grow2">2</div>
    <div class="item grow1">3</div>
  </div>
</body>
</html>
