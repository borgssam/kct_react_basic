<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>04 justify-content</title>
  <style>
    .demos { display: flex; flex-wrap: wrap; gap: 0 32px; }
    p { margin: 12px 0 6px; font-family: monospace; }

    .container {
      display: flex;
      width: 300px; /* 상자 3개(60px × 3 = 180px)를 놓으면 120px이 남는다 */
      height: 70px;
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      width: 60px;
      height: 60px;
      line-height: 60px;
      text-align: center;
      font-weight: bold;
      color: white;
      background: #0d9488;
      outline: 1px solid white;
    }

    .start   { justify-content: flex-start; }
    .center  { justify-content: center; }
    .end     { justify-content: flex-end; }
    .between { justify-content: space-between; }
    .around  { justify-content: space-around; }
    .evenly  { justify-content: space-evenly; }
  </style>
</head>
<body>
  <div class="demos">
    <div>
      <p>flex-start (기본값)</p>
      <div class="container start">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>center</p>
      <div class="container center">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>flex-end</p>
      <div class="container end">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>space-between</p>
      <div class="container between">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>space-around</p>
      <div class="container around">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
    <div>
      <p>space-evenly</p>
      <div class="container evenly">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>
      </div>
    </div>
  </div>
</body>
</html>
