<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>08 align-self</title>
  <style>
    .container {
      display: flex;
      justify-content: space-between;
      align-items: center; /* 자식 전체: 세로 가운데 */
      width: 340px;
      height: 200px;
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      width: 60px;
      height: 60px;
      line-height: 60px;
      text-align: center;
      font-weight: bold;
      color: white;
      background: #0d9488;
    }

    /* 자식 하나: 나만 다르게 */
    .up {
      align-self: flex-start;
      background: #dc2626;
    }
    .down {
      align-self: flex-end;
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item up">1</div>
    <div class="item">2</div>
    <div class="item down">3</div>
  </div>
</body>
</html>
