<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>01 display flex</title>
  <style>
    .container {
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      width: 80px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
      background: #0d9488;
      outline: 1px solid white;
    }

    /* 부모에 이 한 줄을 주면 자식들이 가로로 놓인다 */
    .flex {
      display: flex;
    }
  </style>
</head>
<body>
  <p>display: flex 없음</p>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <p>display: flex 있음</p>
  <div class="container flex">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>
</body>
</html>
