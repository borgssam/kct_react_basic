<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>11 쌓임 맥락</title>
  <style>
    .group {
      position: absolute;
      width: 260px;
      height: 150px;
      padding: 8px;
      font-weight: bold;
    }
    .group1 { top: 20px; left: 20px; z-index: 1; background: #fde68a; }
    .group2 { top: 90px; left: 130px; z-index: 2; background: #bfdbfe; }

    .child {
      position: absolute;
      top: 30px;
      left: 40px;
      z-index: 999; /* 숫자는 크지만 봉투1 안에 갇혀 있다 */
      width: 170px;
      height: 80px;
      padding: 6px;
      color: white;
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="group group1">
    봉투1 (z-index: 1)
    <div class="child">자식 (z-index: 999)</div>
  </div>
  <div class="group group2">봉투2 (z-index: 2)</div>
</body>
</html>
