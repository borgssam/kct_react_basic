<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>08 sticky bottom</title>
  <style>
    .bar {
      position: sticky;
      bottom: 0; /* 화면 아래쪽 변보다 밑으로 내려가지 않는다 */
      padding: 12px;
      font-weight: bold;
      color: white;
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div id="before"></div>
  <div class="bar">sticky 막대 (40번째 줄 다음이 원래 자리)</div>
  <div id="after"></div>

  <script>
    // 스크롤이 생기도록 글줄을 만든다. position과는 관계없는 코드다.
    function makeLines(id, start, end) {
      let html = "";
      for (let i = start; i <= end; i++) {
        html += `<p>본문 ${i}번째 줄</p>`;
      }
      document.getElementById(id).innerHTML = html;
    }
    makeLines("before", 1, 40);
    makeLines("after", 41, 60);
  </script>
</body>
</html>
