<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>07 줄 번호와 span</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: repeat(4, 110px);
      grid-template-rows: repeat(3, 70px);
      width: 440px;
      /* 칸 경계를 보려고 그린 격자 무늬. 배치와는 관계없다 */
      background-color: #f1f5f9;
      background-image:
        linear-gradient(#94a3b8 1px, transparent 1px),
        linear-gradient(90deg, #94a3b8 1px, transparent 1px);
      background-size: 110px 70px;
      border: 2px solid #334155;
    }
    .item {
      padding: 6px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      color: white;
      outline: 1px solid white;
    }

    .a { grid-column: 1 / 3; background: #4f46e5; }
    .b { grid-column: 3 / span 2; background: #dc2626; }
    .c { grid-column: 1; grid-row: 2 / 4; background: #059669; }
    .d { grid-column: 2 / -1; grid-row: 2; background: #d97706; }
    .e { grid-column: 3; grid-row: 3; background: #0284c7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="item a">A: 1 / 3</div>
    <div class="item b">B: 3 / span 2</div>
    <div class="item c">C: 행 2 / 4</div>
    <div class="item d">D: 2 / -1</div>
    <div class="item e">E: 3, 행 3</div>
  </div>
</body>
</html>
