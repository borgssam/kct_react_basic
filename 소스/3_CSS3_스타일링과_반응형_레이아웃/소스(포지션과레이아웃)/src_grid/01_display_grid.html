<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>01 display grid</title>
  <style>
    p { margin: 12px 0 6px; font-family: monospace; }

    .container {
      display: grid;
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-weight: bold;
      color: white;
      background: #4f46e5;
      outline: 1px solid white;
    }

    /* 칸을 나눠 주어야 비로소 바둑판이 된다 */
    .three { grid-template-columns: 100px 100px 100px; }
  </style>
</head>
<body>
  <p>display: grid만 줌</p>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <p>grid-template-columns: 100px 100px 100px</p>
  <div class="container three">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </div>
</body>
</html>
