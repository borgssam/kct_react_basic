<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>06 gap</title>
  <style>
    p { margin: 12px 0 6px; font-family: monospace; }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 600px;
      background: #f1f5f9;
      border: 2px solid #334155;
    }
    .item {
      height: 44px;
      line-height: 44px;
      text-align: center;
      font-weight: bold;
      color: white;
      background: #4f46e5;
    }

    .one { gap: 12px; }
    .two { gap: 24px 8px; } /* 행 사이 24px, 열 사이 8px */
  </style>
</head>
<body>
  <p>gap: 12px</p>
  <div class="container one">
    <div class="item">1</div><div class="item">2</div><div class="item">3</div>
    <div class="item">4</div><div class="item">5</div><div class="item">6</div>
  </div>

  <p>gap: 24px 8px</p>
  <div class="container two">
    <div class="item">1</div><div class="item">2</div><div class="item">3</div>
    <div class="item">4</div><div class="item">5</div><div class="item">6</div>
  </div>
</body>
</html>
