<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인라인, 내부, 외부 스타일시트</title>
  <style>
    /* 내부(internal) 스타일시트 */
    .internal { color: green; }
  </style>
  <link rel="stylesheet" href="3_1_CSS_개발_환경_구축_및_스타일_적용_02_인라인_내부_외부_스타일.css">
</head>
<body>
  <!-- 인라인(inline) -->
  <p style="color: red;">인라인 스타일: 태그 안에 직접 쓴다.</p>

  <!-- 내부(internal): head의 style 태그 -->
  <p class="internal">내부 스타일: head 안의 style 태그로 지정한다.</p>

  <!-- 외부(external): link로 연결한 .css 파일 -->
  <p class="external">외부 스타일: 별도의 .css 파일로 분리해 연결한다.</p>
</body>
</html>
