  <p>줄 간격은 글을 읽는 속도와 피로도에 큰 영향을 준다. 글줄 사이가 너무 좁으면 다음 줄을 찾기 어렵고, 너무 넓으면 문단이 흩어져 보인다. 본문에는 글자 크기의 1.5배에서 1.8배 정도가 읽기 편하다. 숫자만 쓰면 글자 크기에 비례해 적용되므로, 글자 크기를 바꿔도 비율이 그대로 유지된다.</p>
