<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display와 overflow</title>
  <link rel="stylesheet" href="3_4_박스_모델과_요소의_크기_03_display와_overflow.css">
</head>
<body>
  <span class="inline-block">inline-block</span>
  <span class="inline-block">옆으로 흐르면서 크기 지정</span>
  <div class="box">
    overflow: auto는 내용이 넘칠 때만 스크롤바를 만든다.
    상자의 높이는 100px로 고정되어 있고, 이 문장은 그보다 길어서 상자 밖으로 넘친다.
    visible, hidden, scroll, auto 값을 바꿔 가며 차이를 확인해 보자.
    visible은 넘쳐도 그냥 보이고, hidden은 넘친 부분이 잘린다.
  </div>
</body>
</html>
